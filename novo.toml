[package]
name        = "ina226-nv"
version     = "0.1.0"
description = "A driver for Texas Instruments' INA226 current, voltage and power monitor on an I2C bus: the configuration (averaging, conversion times, mode), the calibration register from the shunt resistance and the data sheet's formula, the shunt voltage, bus voltage, current and power with their steps, the alert function and limit, and the manufacturer and die ID check, as devices-nv's CurrentMonitor and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["ina226", "ina219", "current", "power", "voltage", "monitor", "shunt", "i2c", "sensor", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/ina226-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.24.0"

# Every module of the package checks at the embedded tier, so a program
# of any tier, embedded, rt or system, may call it.
[tier]
tier = "embedded"

# The device program, examples/power_read.nv, has no [[bin]] entry: an
# entry makes the registry list the package as a program, and a library
# with an entry would be built by `novo install` for the host.
# tests/device_build.sh builds the program for three boards as the main of
# a scratch package that depends on this one.

[docs.pages]
"README.md" = "Reading an INA226 current monitor from a device program"

[dependencies]
# The board's I2C bus and GPIO handles, and the I2cBus and GpioOut traits
# they implement.  Both are in 0.3.2, which the registry serves; a path
# dependency here would make devices-nv's own range a second package.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the CurrentMonitor trait, which is in devices-nv 0.3.3.  The
# registry's newest devices-nv is 0.3.2, so this is a path dependency
# until 0.3.3 is published (PATH-DEPENDENCIES.md).
devices-nv      = { path = "../devices-nv" }
